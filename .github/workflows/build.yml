name: Build

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  release-sync:
    name: Installer/CLI version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION, installer header and CHANGELOG are in sync
        run: bash scripts/verify-release-sync.sh

  test-scripts:
    name: Shell script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and openssl
        run: sudo apt-get update && sudo apt-get install -y bats openssl
      - name: Run shell script tests
        run: bats scripts/test/

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Run server tests
        run: npm test --prefix server

  test-worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install worker dependencies
        run: npm install --prefix worker
      - name: Run worker tests
        run: npm test --prefix worker

  test-client-unit:
    name: Client unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root Next.js dependencies
        run: npm install
      - name: Run client unit tests
        run: npm run test:client:unit

  build:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    needs: [release-sync, test-scripts, test-server, test-worker, test-client-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root Next.js dependencies
        run: npm install
      - name: Install server dependencies
        run: npm install --prefix server
      - name: Lint Next.js source
        run: npm run lint
      - name: Build Next.js production app
        run: npm run build
