name: Build

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  release-sync:
    name: Installer/CLI version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION, installer header and CHANGELOG are in sync
        run: bash scripts/verify-release-sync.sh

  test-scripts:
    name: Shell script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and openssl
        run: sudo apt-get update && sudo apt-get install -y bats openssl
      - name: Run shell script tests
        run: bats scripts/test/

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install monolith dependencies
        run: npm install
      - name: Run server tests
        run: npm run test:server

  test-worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install worker dependencies
        run: npm install --prefix worker
      - name: Typecheck worker
        run: npm --prefix worker run typecheck
      - name: Run worker tests
        run: npm --prefix worker run test

  test-client-unit:
    name: Client unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install monolith dependencies
        run: npm install
      - name: Run client unit tests
        run: npm run test:client:unit

  build:
    name: Next.js 16 + TypeScript Production Build
    runs-on: ubuntu-latest
    needs: [release-sync, test-scripts, test-server, test-worker, test-client-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install monolith dependencies
        run: npm install
      - name: TypeScript typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint TypeScript monolith
        run: npm run lint
      - name: Build Next.js 16 production app
        run: npm run build
