name: Build

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  release-sync:
    name: Installer/CLI version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION, installer header and CHANGELOG are in sync
        run: bash scripts/verify-release-sync.sh

  test-scripts:
    name: Shell script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and openssl
        run: sudo apt-get update && sudo apt-get install -y bats openssl
      - name: Run shell script tests
        run: bats scripts/test/

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nextdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nextdesk_test
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/nextdesk_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install monolith dependencies
        run: npm install
      - name: Validate Prisma 7 schema & generate client
        run: npx prisma validate && npx prisma generate
      - name: Apply PostgreSQL migrations
        run: npm run db:migrate
      - name: Run server tests against PostgreSQL 17
        run: npm run test:server

  test-worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install worker dependencies
        run: npm install --prefix worker
      - name: Typecheck worker
        run: npm --prefix worker run typecheck
      - name: Run worker tests
        run: npm --prefix worker run test

  test-client-unit:
    name: Client unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install monolith dependencies
        run: npm install
      - name: Run client unit tests
        run: npm run test:client:unit

  build:
    name: Next.js 16 + TypeScript Production Build
    runs-on: ubuntu-latest
    needs: [release-sync, test-scripts, test-server, test-worker, test-client-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install monolith dependencies
        run: npm install
      - name: Validate Prisma 7 schema & generate client
        run: npx prisma validate && npx prisma generate
      - name: TypeScript typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: Lint TypeScript monolith
        run: npm run lint
      - name: Build Next.js 16 production app
        run: npm run build
