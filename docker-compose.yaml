services:
  postgres:
    image: postgres:17-alpine
    container_name: nextdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nextdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nextdesk:
    # Use the pre-built image from Docker Hub (recommended):
    image: ${NEXTDESK_IMAGE:-MASolutionExpert/nextdesk:latest}
    # Or build locally from source (uncomment and remove the image line above):
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: nextdesk
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${SERVER_PORT:-5174}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      SERVER_PORT: ${SERVER_PORT:-5174}
      BIND_ADDRESS: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-nextdesk}}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-nextdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      NEXTDESK_CONTAINER_NAME: ${NEXTDESK_CONTAINER_NAME:-nextdesk}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      WORKER_PORT: ${WORKER_PORT:-8080}
      STORAGE_PROCESSING_MODE: ${STORAGE_PROCESSING_MODE:-auto}
      WORKER_URL: ${WORKER_URL:-${MEDIA_WORKER_URL:-}}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - nextdesk-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-443}:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
    depends_on:
      nextdesk:
        condition: service_healthy

volumes:
  nextdesk-data:
  postgres-data:
